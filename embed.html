<!DOCTYPE html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nijatva Frame</title>
<meta name="theme-color" content="#0b1220">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  :root{--bg:#202124;--surf:#292a2d;--line:#3c4043;--fg:#e8eaed;--mut:#9aa0a6;--brand:#1a73e8}
  html[data-theme="light"]{--bg:#fff;--surf:#f1f3f4;--line:#dadce0;--fg:#202124;--mut:#5f6368}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #bar{display:flex;gap:8px;align-items:center;padding:8px;background:var(--surf);
    border-bottom:1px solid var(--line)}
  #bar button{background:transparent;border:1px solid var(--line);color:var(--fg);
    border-radius:8px;min-width:38px;height:34px;font-size:15px;cursor:pointer}
  #bar button:hover{border-color:var(--brand);color:var(--brand)}
  #u{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--fg);
    border-radius:17px;padding:8px 14px;font-size:14px}
  #u:focus{outline:none;border-color:var(--brand)}
  #stage{position:relative;height:calc(100% - 51px)}
  #f{width:100%;height:100%;border:0;background:#fff}
  #note{position:absolute;inset:0;display:none;place-items:center;padding:24px;text-align:center;
    background:var(--bg)}
  #note.on{display:grid}
  #note h2{margin:0 0 8px;font-size:17px}
  #note p{margin:0 0 16px;color:var(--mut);font-size:13.5px;max-width:420px}
  #note a{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;
    padding:10px 18px;border-radius:20px;font-size:14px;font-weight:600}
</style>
</head><body>
<div id="bar">
  <button id="back" title="Back">&#8592;</button>
  <button id="fwd" title="Forward">&#8594;</button>
  <button id="reload" title="Reload">&#8635;</button>
  <input id="u" placeholder="Search or type a URL" autocomplete="off" spellcheck="false">
  <button id="open" title="Open in a new tab">&#8599;</button>
</div>
<div id="stage">
  <iframe id="f" referrerpolicy="no-referrer-when-downgrade"
          allow="clipboard-read; clipboard-write; fullscreen; autoplay"></iframe>
  <div id="note">
    <div>
      <h2 id="nt">This site does not allow being framed</h2>
      <p id="np">Its owner set a header (X-Frame-Options or Content-Security-Policy) that stops other
        pages from showing it inside a frame. That is their choice, and no embed can override it.</p>
      <a id="na" href="#" target="_blank" rel="noopener">Open it in a new tab</a>
    </div>
  </div>
</div>
<script>
(function () {
  var f = document.getElementById('f');
  var u = document.getElementById('u');
  var note = document.getElementById('note');
  var nt = document.getElementById('nt'), np = document.getElementById('np'), na = document.getElementById('na');
  var history = [], at = -1, timer = null;

  function normalise(input) {
    var s = (input || '').trim();
    if (!s) return '';
    if (/^https?:\/\//i.test(s)) return s;
    if (s.indexOf(' ') >= 0 || s.indexOf('.') < 0)
      return 'https://duckduckgo.com/?q=' + encodeURIComponent(s);
    return 'https://' + s;
  }

  function show(url, push) {
    if (!url) return;
    note.classList.remove('on');
    u.value = url;
    f.src = url;
    if (push) { history = history.slice(0, at + 1); history.push(url); at = history.length - 1; }
    // A blocked frame usually fires neither load nor error, so a quiet timeout is
    // the only honest signal: if nothing has loaded in a few seconds, say so.
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (!f.contentWindow) return;
      try {
        // same-origin check: a framed page from another site throws here
        if (f.contentWindow.location.href === 'about:blank') throw 0;
      } catch (e) {
        // cross-origin frames always throw, so this proves nothing on its own -
        // keep the note hidden and let the load event decide
      }
    }, 3000);
  }

  f.addEventListener('load', function () {
    clearTimeout(timer);
    try { if (f.contentWindow.location.href === 'about:blank') blocked(); } catch (e) { }
  });

  function blocked() {
    nt.textContent = 'This site does not allow being framed';
    np.textContent = 'Its owner set a header (X-Frame-Options or Content-Security-Policy) that stops ' +
      'other pages from showing it inside a frame. That is their choice, and no embed can override it.';
    na.href = f.src || '#';
    note.classList.add('on');
  }

  u.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') show(normalise(u.value), true);
  });
  document.getElementById('reload').onclick = function () { f.src = f.src; };
  document.getElementById('open').onclick = function () { window.open(f.src, '_blank', 'noopener'); };
  document.getElementById('back').onclick = function () {
    if (at > 0) { at--; show(history[at], false); }
  };
  document.getElementById('fwd').onclick = function () {
    if (at < history.length - 1) { at++; show(history[at], false); }
  };

  // ?u= is the address to open; ?theme=light flips the chrome
  var q = new URLSearchParams(location.search);
  if ((q.get('theme') || '') === 'light') document.documentElement.dataset.theme = 'light';
  var start = q.get('u') || q.get('url') || '';
  if (start) show(normalise(start), true);
  else u.value = '';
})();
</script>
</body></html>
