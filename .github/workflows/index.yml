name: build index

on:
  push:
    branches: [main]
    paths:
      - "extensions/*.js"

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the catalogue from the script headers
        run: python3 tools/build_index.py
      - name: Commit it if it changed
        run: |
          if git diff --quiet -- extensions/index.json; then
            echo "index.json already current"
            exit 0
          fi
          git config user.name  "nijatva-store-bot"
          git config user.email "nijatva-store-bot@users.noreply.github.com"
          git add extensions/index.json
          git commit -m "index: rebuild from script headers"
          git push
